<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - DermAI</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .offline-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }
        .offline-content {
            text-align: center;
            color: white;
            max-width: 600px;
        }
        .offline-icon {
            font-size: 8rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .offline-title {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .offline-message {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .offline-button {
            background: white;
            color: #667eea;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .offline-button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-content">
            <div class="offline-icon">📡</div>
            <h1 class="offline-title">You're Offline</h1>
            <p class="offline-message">
                It looks like you've lost your internet connection.
                Please check your network and try again.
            </p>
            <a href="javascript:window.location.reload()" class="offline-button">
                Try Again
            </a>
            <div style="margin-top: 2rem; opacity: 0.8;">
                <p>Some features are available offline:</p>
                <ul style="list-style: none; padding: 0; margin-top: 1rem;">
                    <li>✓ View cached pages</li>
                    <li>✓ Access detection history</li>
                    <li>✓ View disease information</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Check connection status
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Retry button
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
